<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuchBits - Arcade Universe</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="page-overlay"></div>

    <div class="main-wrapper">
        <header class="game-header">
            <div class="brand">
                <span class="brand-badge">MUCHBITS</span>
                <h1 class="game-title">ARCADE UNIVERSE</h1>
            </div>
            <div class="header-status">
                <span class="status-dot"></span> EN VIVO
            </div>
        </header>

        <main class="game-card">
            <!--Contenedor para el Canvas del juego-->
            <div id="game-container" class="canvas-wrapper"></div>

            <footer class="controls-bar">
                <div class="control-group movement-controls">
                    <span class="control-label">Movimiento:</span>
                    <button class="key arrow-up" type="button" data-control="up" aria-label="Arriba">▲</button>
                    <button class="key arrow-down" type="button" data-control="down" aria-label="Abajo">▼</button>
                    <button class="key arrow-left" type="button" data-control="left" aria-label="Izquierda">◄</button>
                    <button class="key arrow-right" type="button" data-control="right" aria-label="Derecha">►</button>
                </div>
                <div class="control-group">
                    <span class="control-label">Confirmar:</span>
                    <button class="key action-key" type="button" data-action="enter" aria-label="Enter">ENTER</button>
                    <span class="key">S</span>
                </div>
                <div class="control-group">
                    <span class="control-label">Cancelar / Menú:</span>
                    <button class="key action-key" type="button" data-action="escape" aria-label="Escape">ESC</button>
                    <span class="key">N</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="js/EscenaMenu.js"></script>
    <script src="js/EscenaJuego.js"></script>
    <script src="js/EscenaDinoRun.js"></script>
    <script src="js/mobileControls.js"></script>
    <script src="js/config.js"></script>
</body>

</html>
