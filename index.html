<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MuchBits - Arcade Universe</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="page-overlay"></div>

    <div class="main-wrapper">
        <header class="game-header">
            <div class="brand">
                <span class="brand-badge">MUCHBITS</span>
                <h1 class="game-title">ARCADE UNIVERSE</h1>
            </div>
            <div class="header-status">
                <button id="btn-fullscreen" class="fullscreen-btn" type="button" aria-label="Pantalla Completa">
                    <span class="fs-icon">⛶</span>
                </button>
                <span class="status-dot"></span> EN VIVO
            </div>
        </header>

        <main class="game-card">
            <!--Contenedor para el Canvas del juego-->
            <div id="game-container" class="canvas-wrapper"></div>

            <footer class="controls-bar">
                <!-- Cruceta Arcade (D-Pad) -->
                <div class="dpad-container" aria-label="Controles de Movimiento">
                    <button class="dpad-btn arrow-up" type="button" data-control="up" aria-label="Mover o Saltar Arriba">▲</button>
                    <button class="dpad-btn arrow-left" type="button" data-control="left" aria-label="Mover a la Izquierda">◄</button>
                    <div class="dpad-center" aria-hidden="true"></div>
                    <button class="dpad-btn arrow-right" type="button" data-control="right" aria-label="Mover a la Derecha">►</button>
                    <button class="dpad-btn arrow-down" type="button" data-control="down" aria-label="Mover o Agacharse Abajo">▼</button>
                </div>

                <!-- Botones de Acción Accesibles -->
                <div class="action-buttons-container" aria-label="Botones de Acción">
                    <button class="action-btn btn-confirm" type="button" data-action="enter" aria-label="Aceptar o Entrar (ENTER o S)">
                        <span class="btn-badge">✔</span>
                        <div class="btn-labels">
                            <span class="main-label">ACEPTAR</span>
                            <span class="sub-label">ENTER / S</span>
                        </div>
                    </button>

                    <button class="action-btn btn-cancel" type="button" data-action="escape" aria-label="Menú o Salir (ESC o N)">
                        <span class="btn-badge">✖</span>
                        <div class="btn-labels">
                            <span class="main-label">MENÚ</span>
                            <span class="sub-label">ESC / N</span>
                        </div>
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="js/EscenaMenu.js"></script>
    <script src="js/EscenaJuego.js"></script>
    <script src="js/EscenaDinoRun.js"></script>
    <script src="js/EscenaBiodiversidad.js"></script>
    <script src="js/mobileControls.js"></script>
    <script src="js/config.js"></script>
</body>

</html>
